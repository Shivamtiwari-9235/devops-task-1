name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Normalize Docker Hub token
        id: docker-token
        env:
          RAW_DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "$RAW_DOCKER_TOKEN" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
            | sed -E 's/^Bearer[[:space:]]+//I' \
            | sed -E 's/^"(.*)"$/\1/' \
            | sed -E "s/^'(.*)'$/\1/")"
          if [ -z "$TOKEN" ]; then
            echo "DOCKER_HUB_TOKEN is empty after normalization" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ steps.docker-token.outputs.value }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/nodejs-demo-app:latest

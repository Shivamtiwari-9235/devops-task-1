name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  build-and-push-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          token="$(printf '%s' "$DOCKER_HUB_TOKEN" | tr -d '\r\n' | sed -E 's/^Bearer[[:space:]]+//' | sed -E 's/^"(.*)"$/\1/')"
          if [ -z "$token" ]; then
            echo "DOCKER_HUB_TOKEN is empty after normalization."
            exit 1
          fi
          echo "::add-mask::$token"
          printf '%s' "$token" | docker login -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/nodejs-demo-app:latest

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
